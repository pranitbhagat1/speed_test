name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main  # change to 'master' if that's your branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href /speed_test/
        # ↑ Replace 'speed_test' with your exact GitHub repo name

      - name: Deploy to GitHub Pages
        uses: bluefireteam/flutter-gh-pages@v9
          # ↑ Same as above — must match your repo name exactly